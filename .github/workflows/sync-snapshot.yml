name: sync-snapshot

# player_snapshots is the only table that cannot be backfilled — the FPL API has no
# history endpoint, so any unsampled moment is gone permanently. This is why the job
# runs from before the season starts even though prices are frozen until GW1
# (verified 2026-07-26: max(transfers_in) = 0, cost_change_start = 0 for all 558
# players). What it banks in the meantime is ownership drift across 1.57M squads.

on:
  # THE REAL CLOCK IS NOT HERE. It is pg_cron inside Supabase — migration 0019 — which calls
  # this workflow through `workflow_dispatch`. Read that migration's header for the numbers;
  # the short version is that GitHub delivered 12 of 33 scheduled runs over 24 hours and 1 of
  # 12 in the nightly price window, and moving every cron off the round minute (cd2986a) only
  # took the median gap from ~200 minutes to ~130. `schedule` is best-effort by design and
  # cannot be made hourly. `workflow_dispatch` is an ordinary API-triggered run and is not
  # dropped, so the fix was to change the trigger type rather than the minute.
  #
  # Change the cadence in `cron.job`, not in this file:
  #   select jobname, schedule from cron.job;
  #   select cron.schedule('snapshot-hourly', '17 * * * *',
  #                        $$select dispatch_workflow('sync-snapshot.yml')$$);
  schedule:
    # Backstop only, and deliberately sparse. If pg_net loses its token or pg_cron is disabled
    # this is what keeps *some* of an unbackfillable series alive until someone notices. Eight
    # attempts a day at GitHub's observed ~36% delivery is ~3 captures — useless as a series,
    # enough that `snapshot_coverage` shows a gap rather than a dead table. Sparse because
    # every run bills at the 1-minute minimum and the primary schedule already spends half
    # the free private-repo allowance.
    - cron: '47 */3 * * *'
  workflow_dispatch:

concurrency:
  # Never let a delayed run overlap the next tick — snapshots are insert-on-change and
  # two concurrent runs would race on the same comparison baseline.
  group: sync-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install "psycopg[binary]>=3.2" "requests>=2.32"

      - name: Snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # --no-cache: the raw payload cache is pointless on an ephemeral runner, and at
        # hourly cadence it would be the largest thing in the workspace.
        run: python -m sync.cli snapshot --no-cache

      # The data just changed, so the site has to be rebuilt to show it — see
      # .github/actions/rebuild-site for why freshness is a deploy rather than a cache.
      - name: Rebuild the site
        uses: ./.github/actions/rebuild-site
        with:
          deploy-hook: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
