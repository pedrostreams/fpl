name: sync-daily

# Dimensions, fixtures and per-gameweek history. Runs after the nightly price window has
# closed so the day's first full sync sees settled data.

on:
  schedule:
    # :37 rather than :30 — this job was scheduled for 06:30 on 2026-07-27 and GitHub did not
    # start it until 10:26, nearly four hours late. Round minutes are the contended ones.
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Parse and report without writing'
        type: boolean
        default: false

concurrency:
  group: sync-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    # history makes ~558 requests at 0.25s spacing (~140s) plus upserts.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install "psycopg[binary]>=3.2" "requests>=2.32"

      - name: Sync dimensions + history + snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m sync.cli all --no-cache \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Steps here rather than a workflow of their own, because both are two API calls and a
      # handful of upserts — a separate schedule would cost a billed minute each at the 1-minute
      # minimum, and `verify` already reports that snapshot dispatches alone project 1654 of the
      # 2000 free-tier minutes a month.
      #
      # THESE WERE IN NO WORKFLOW AT ALL UNTIL 2026-08-24, AND NOBODY NOTICED FOR THREE DAYS.
      # `sync.cli all` is dimensions + history + snapshot; `manager` and `league` are not in it,
      # and adding a job to `JOBS` does not schedule it. Both had run exactly once, by hand, on
      # 2026-07-30 — three weeks before the deadline, when `picks` still 404'd for everybody. So
      # `manager_picks` stayed empty through the GW1 deadline and `/me` went on rendering its
      # "not published yet" panel, which is indistinguishable from the correct preseason state
      # and is why this took three days to spot. `sync_freshness` had it the whole time: every
      # other job an hour old, these two twenty-five days.
      #
      # Ordered before Verify deliberately — `my_squad_check` and `league_check` assert on what
      # they write, and a check that runs before its own ingest asserts nothing.
      - name: Sync my entry + the mini-league
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m sync.cli manager --no-cache \
            ${{ inputs.dry_run && '--dry-run' || '' }}
          python -m sync.cli league --no-cache \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # A green sync only proves the process exited 0. This checks the things that can be
      # silently wrong: season attribution, unresolved references, snapshot
      # insert-on-change behaviour, stale runs, and growth against the 500 MB free tier.
      # Exits non-zero on any problem, so the workflow goes red.
      - name: Verify
        if: ${{ !inputs.dry_run }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m sync.cli verify

      # The data just changed, so the site has to be rebuilt to show it — see
      # .github/actions/rebuild-site for why freshness is a deploy rather than a cache.
      - name: Rebuild the site
        if: ${{ !inputs.dry_run }}
        uses: ./.github/actions/rebuild-site
        with:
          deploy-hook: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
