name: sync-enrich

# Tier 2 sources: Understat (PPDA, deep completions, shot events), FPL-Core-Insights
# (per-match player stats), ClubElo, and bookmaker odds.
#
# Runs after sync-daily so `teams` and `player_seasons` exist — every job here resolves
# against them. Staggered from 06:30 to leave the FPL sync room to finish.
#
# Sofascore is deliberately absent: it returns 403 to Actions runners (datacenter IPs are
# filtered). FPL-Core-Insights covers the same ground at per-match granularity and is
# GitHub-hosted. See docs/DATA_SOURCES.md §3.2.

on:
  schedule:
    - cron: '19 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and transform without writing'
        type: boolean
        default: false
      rematch:
        description: 'Discard stored identity mappings and re-resolve (Understat)'
        type: boolean
        default: false

concurrency:
  group: sync-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    # Understat pulls ~9.5k shot events; Core-Insights walks one CSV per gameweek.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # No soccerdata cache on purpose. It caches aggressively and silently serves a
      # partial season — a stale local cache reported 346 of 380 matches and that wrong
      # figure made it into our docs before a cold CI run contradicted it. A fresh runner
      # is a cold cache every time, which is the property we want. One league's scrape is
      # cheap enough that correctness wins.
      - name: Enrichment sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m sync.cli enrich \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.rematch && '--rematch' || '' }}

      - name: Verify
        if: ${{ !inputs.dry_run }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m sync.cli verify
