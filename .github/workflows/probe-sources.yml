name: probe-sources

# Source health check. The free football data landscape lost StatsBomb-on-FBref and then
# Opta-on-FBref inside about a year, so a scheduled probe is the difference between
# noticing a source died this week and noticing it after a month of silent gaps.
#
# The probe exits with the number of failed checks, so the job goes red on any breakage.

on:
  schedule:
    - cron: '0 8 * * 1'   # Monday morning
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe/**'
      - 'sync/**'
      - 'requirements.txt'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Probe all sources
        env:
          # Unauthenticated GitHub API is 60 requests/hour per IP and runners share IPs,
          # which rate-limited the FPL-Core-Insights check. GITHUB_TOKEN is injected
          # automatically and lifts the ceiling well clear of real usage.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/probe/probe_sources.py

      # Guards the one logic path whose silent failure is unrecoverable: if the
      # insert-on-change comparison ever reported "unchanged" for everything, snapshots
      # would stop being written and the run would still look clean.
      - name: Prove snapshot insert-on-change logic
        run: python scripts/probe/prove_snapshot_logic.py

      # Name matching is the other place a bug is silent: a wrong match attributes one
      # player's xG to another and nothing errors. Ten false positives reached the database
      # before these cases existed.
      - name: Prove player name matching
        run: python scripts/probe/prove_player_matching.py

      - name: Dry-run every sync job
        run: |
          python -m sync.cli dimensions --dry-run --no-cache
          python -m sync.cli snapshot --dry-run --no-cache
          python -m sync.cli history --dry-run --no-cache --limit 5
